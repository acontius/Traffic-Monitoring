name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, format, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff black

      - run: ruff check .
      - run: black --check .
      - run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Exercises the same login -> devices -> auth path documented in
      # SMOKE_TEST.md, against the real images this repo ships (catches
      # startup regressions unit tests can't, e.g. Settings rejecting the
      # shared .env's simulator/admin-only vars).
      - name: Build and start db, app, mock-external
        run: |
          cp .env.example .env
          docker compose up -d --build db app mock-external

      - name: Wait for the hub to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "hub is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::hub never became healthy" >&2
          exit 1

      - name: Create admin user and exercise the API
        run: |
          docker compose exec -T app python -m Backend.scripts.create_admin \
            --username admin --password smoke-test

          TOKEN=$(curl -sf -X POST http://localhost:8000/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"smoke-test"}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")

          curl -sf http://localhost:8000/devices \
            -H "Authorization: Bearer $TOKEN" > /dev/null

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
