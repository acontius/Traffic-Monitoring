# Reverse proxy for the Angular SPA + TCMS API/WebSocket (SRS 9: "Reverse
# proxy برای پنل وب"). /api/* is stripped and forwarded to the FastAPI hub,
# including WebSocket upgrades for /api/ws/*; everything else falls back to
# index.html so Angular's client-side router can handle deep links.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
